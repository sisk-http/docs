{{- if eq .Type "alert" -}}
{{- $type := lower .AlertType -}}
<div class="callout callout-{{ $type }}" role="note">
    <p class="callout-title">{{ partial "icon.html" $type }}{{ T $type | default (title $type) }}</p>
    {{ .Text }}
</div>
{{- else -}}
<blockquote>{{ .Text }}</blockquote>
{{- end -}}
